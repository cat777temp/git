name: 编译Git Linux ARM可执行文件

on:
  push:
    tags:
      - 'v2.17.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libssl-dev libcurl4-openssl-dev \
            libexpat-dev gettext zlib1g-dev asciidoc xmlto docbook2x \
            gcc-arm-linux-gnueabihf libc6-dev-armhf-cross

      - name: 配置Git源码
        run: |
          ./configure --host=arm-linux-gnueabihf \
            --build=x86_64-linux-gnu \
            --prefix=/usr \
            --without-tcltk

      - name: 编译Git
        run: |
          make -j$(nproc) CFLAGS="-O2" LDFLAGS="-static" NO_GETTEXT=1 NO_OPENSSL=1 NO_CURL=1 NO_EXPAT=1 NO_REGEX=1 NO_PTHREADS=1 NO_ICONV=1 CROSS_COMPILE=arm-linux-gnueabihf-

      - name: 创建发布目录
        run: |
          mkdir -p release
          cp git release/git-${{ github.ref_name }}-linux-arm
          arm-linux-gnueabihf-strip release/git-${{ github.ref_name }}-linux-arm

      - name: 打包可执行文件
        run: |
          cd release
          tar -czvf git-${{ github.ref_name }}-linux-arm.tar.gz git-${{ github.ref_name }}-linux-arm

      - name: 上传到发布
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/git-${{ github.ref_name }}-linux-arm.tar.gz
            release/git-${{ github.ref_name }}-linux-arm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
